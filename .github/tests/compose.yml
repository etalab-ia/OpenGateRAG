services:
  # Used by OpenGateLLM, not by OpenGateRAG.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "ELASTIC_USERNAME=elasticsearch"
      - "ELASTIC_PASSWORD=changeme"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16.5
    restart: always
    user: postgres
    environment:
      - "CREATE_DB=opengatellm,opengaterag"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=changeme"
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-entrypoint.sh:/docker-entrypoint-initdb.d/postgres_entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-U", "postgres" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s
    
  redis:
    image: redis/redis-stack-server:7.4.0-v7
    restart: always
    environment:
      REDIS_ARGS: "--dir /data --requirepass changeme --user redis on >password ~* allcommands --save 60 1 --appendonly yes"
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    image: ghcr.io/etalab-ia/opengatellm/api:${OPENGATELLM_VERSION:?}
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ALBERT_ADMIN_API_KEY=${ALBERT_ADMIN_API_KEY}
    volumes:
      - "./config.opengatellm.yml:/config.yml:ro"
    healthcheck:
        test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
        interval: 4s
        timeout: 10s
        retries: 5
        start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    

volumes:
  postgres:
  redis:
  elasticsearch: