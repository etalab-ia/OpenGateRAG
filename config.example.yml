# -------------------------------- dependencies ---------------------------------
dependencies:
  opengatellm:
    url: ${OPENGATELLM_URL:-http://localhost:8000}
    model_name: ${OPENGATELLM_MODEL_NAME:-openweight-embeddings}
    model_vector_size: ${OPENGATELLM_MODEL_VECTOR_SIZE:-1024}
    # openapi_url: /openapi.json

  postgres:
    url: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
    echo: False
    pool_size: 5
    connect_args:
      server_settings:
        statement_timeout: "120s"
      command_timeout: 60

# ---------------------------------- settings -----------------------------------
settings:
  # storage_default_limit: 10000000  # 10M tokens by default, set to null for unlimited
  # storage_compute_tokenizer: tiktoken_gpt2  # default tokenizer
  # disabled_routers: ["collections"]
