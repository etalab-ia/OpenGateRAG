name: opengaterag

services:
  rag:
    image: ghcr.io/etalab-ia/opengaterag-next:latest
    restart: always
    env_file: .env
    environment:
      - "OPENGATELLM_URL=${OPENGATELLM_URL:-http://api:8000}"
      - "MEILISEARCH_URL=${MEILISEARCH_URL:-http://meilisearch:7700}"
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - "${CONFIG_FILE:-./config.yml}:/config.yml:ro"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]

  postgres:
    image: postgres:16.5
    restart: always
    user: postgres
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}"
      - "POSTGRES_DB=postgres"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-U", "postgres" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    restart: always
    environment:
      - "MEILI_ENV=production"
      - "MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-changemechangeme}"
      - "MEILI_NO_ANALYTICS=true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch:/meili_data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres:
  redis:
  meilisearch:
